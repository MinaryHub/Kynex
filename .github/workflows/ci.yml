name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: fmt / clippy / test
    strategy:
      fail-fast: false
      # The viewer is meant to run anywhere: so is the server behind it.
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Each demo run an hour and held to what it made when last measured
      # (demos::tests::KPIS): a change that makes one make much less, or
      # stop, fails here — and is not released. Once, not on every system.
      - name: Demo KPIs
        if: runner.os == 'Linux'
        run: cargo test -p kynex --lib demo_kpis -- --ignored

  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Build Android APK
        shell: bash
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -d "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ -z "${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}" ] && [ ! -d "$ANDROID_HOME/ndk" ]; then
              "$SDKMANAGER" "ndk;28.2.13676358"
            fi
          fi
          ./tools/android.sh
