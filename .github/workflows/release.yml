name: Release

# Every commit on main is a build with its own number (tools/version.rs:
# major.minor.<commits>), released for Windows, Linux and macOS as
# v<version>. Or run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit: the build number counts them.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p kynex

      - name: Version
        id: version
        shell: bash
        run: |
          v=$(./target/release/kynex --version | cut -d' ' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "KYNEX $v"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 5.0.2
          ./tools/package.ps1

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p target/dist "KYNEX-$v"
          cp target/release/kynex "KYNEX-$v/"
          [ -f target/release/kynex-studio ] && cp target/release/kynex-studio "KYNEX-$v/"
          cp README.md "KYNEX-$v/"
          tar -czf "target/dist/KYNEX-$v-${{ matrix.name }}.tar.gz" "KYNEX-$v"

      - uses: actions/upload-artifact@v4
        with:
          name: kynex-${{ matrix.name }}
          path: |
            target/dist/*.exe
            target/dist/*.msi
            target/dist/*.zip
            target/dist/*.tar.gz
          if-no-files-found: error

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$V" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KYNEX $V" \
            --notes "KYNEX $V ($GITHUB_SHA) — Windows (설치 파일·MSI·zip), Linux x64, macOS arm64."
