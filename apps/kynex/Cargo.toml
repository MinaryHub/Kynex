[package]
name = "kynex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kynex-model.workspace = true
kynex-link.workspace = true
kynex-view.workspace = true
kreate-scene.workspace = true
kreate-io.workspace = true
kreate-math.workspace = true
kreate-mesh.workspace = true
kynex-kin.workspace = true
kynex-collide.workspace = true
serde_json.workspace = true
rayon.workspace = true
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
rand = "0.8"
pkcs8 = { version = "0.10", features = ["pem"] }
cbc = { version = "0.1", features = ["alloc"] }
x509-cert = { version = "0.2", features = ["builder", "hazmat"] }
const-oid = "0.9"

# KYNEX's own window (`studio`): the system's WebView2 in a window of its
# own, on Windows.
[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"

[[bin]]
name = "kynex"
path = "src/main.rs"

[[bin]]
name = "kynex-studio"
path = "src/bin/kynex-studio.rs"

[build-dependencies]
embed-resource = "3"
